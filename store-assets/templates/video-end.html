<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #29C5E6 0%, #7ED4EF 30%, #FBE3B8 65%, #F6821F 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 60px;
  }
  .icon {
    width: 300px;
    height: 300px;
    border-radius: 60px;
    border: 8px solid #17303B;
    transform: rotate(2deg);
    box-shadow: 14px 14px 0 rgba(23, 48, 59, 0.55);
  }
  .card {
    background: #FFFDF7;
    border: 8px solid #17303B;
    border-radius: 32px;
    box-shadow: 14px 14px 0 rgba(23, 48, 59, 0.55);
    padding: 34px 64px;
    transform: rotate(-1deg);
    font-size: 72px;
    font-weight: 900;
    color: #17303B;
    letter-spacing: -1px;
    text-align: center;
  }
  .cta {
    background: #17303B;
    color: #FFFDF7;
    border-radius: 24px;
    box-shadow: 10px 10px 0 rgba(23, 48, 59, 0.35);
    padding: 26px 54px;
    font-size: 48px;
    font-weight: 800;
    transform: rotate(1deg);
  }
</style>
</head>
<body>
  <img class="icon" src="../../assets/icon.png" alt="">
  <div class="card">Make every unlock count.</div>
  <div class="cta">Free on Google Play</div>
</body>
</html>
