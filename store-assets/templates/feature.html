<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(115deg, #29C5E6 0%, #2E9BF0 35%, #F9B234 70%, #F6821F 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
  }
  .icon {
    width: 240px;
    height: 240px;
    border-radius: 48px;
    border: 5px solid #17303B;
    transform: rotate(-3deg);
    box-shadow: 8px 8px 0 rgba(23, 48, 59, 0.55);
    /* the source art has its own gradient padding; crop into the rounded square */
    object-fit: cover;
    object-position: center;
    scale: 1;
  }
  .text { max-width: 560px; }
  .card {
    display: inline-block;
    background: #FFFDF7;
    border: 5px solid #17303B;
    border-radius: 24px;
    box-shadow: 8px 8px 0 rgba(23, 48, 59, 0.55);
    padding: 22px 34px;
    transform: rotate(1deg);
  }
  h1 {
    font-size: 58px;
    font-weight: 900;
    color: #17303B;
    letter-spacing: -1px;
    line-height: 1.05;
  }
  .tagline {
    margin-top: 26px;
    font-size: 30px;
    font-weight: 700;
    color: #17303B;
    background: #FFFDF7;
    border: 4px solid #17303B;
    border-radius: 16px;
    box-shadow: 6px 6px 0 rgba(23, 48, 59, 0.55);
    padding: 12px 22px;
    display: inline-block;
    transform: rotate(-1deg);
  }
</style>
</head>
<body>
  <img class="icon" src="../../assets/icon.png" alt="">
  <div class="text">
    <div class="card"><h1>Lock Screen Facts</h1></div>
    <br>
    <div class="tagline">Learn something new,<br>every time you unlock.</div>
  </div>
</body>
</html>
