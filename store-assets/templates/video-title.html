<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(115deg, #29C5E6 0%, #2E9BF0 35%, #F9B234 70%, #F6821F 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 90px;
  }
  .icon {
    width: 420px;
    height: 420px;
    border-radius: 84px;
    border: 8px solid #17303B;
    transform: rotate(-3deg);
    box-shadow: 14px 14px 0 rgba(23, 48, 59, 0.55);
  }
  .card {
    display: inline-block;
    background: #FFFDF7;
    border: 8px solid #17303B;
    border-radius: 36px;
    box-shadow: 14px 14px 0 rgba(23, 48, 59, 0.55);
    padding: 40px 60px;
    transform: rotate(1deg);
  }
  h1 {
    font-size: 100px;
    font-weight: 900;
    color: #17303B;
    letter-spacing: -2px;
    line-height: 1.05;
  }
  .tagline {
    margin-top: 44px;
    font-size: 52px;
    font-weight: 700;
    color: #17303B;
    background: #FFFDF7;
    border: 6px solid #17303B;
    border-radius: 24px;
    box-shadow: 10px 10px 0 rgba(23, 48, 59, 0.55);
    padding: 22px 38px;
    display: inline-block;
    transform: rotate(-1deg);
  }
</style>
</head>
<body>
  <img class="icon" src="../../assets/icon.png" alt="">
  <div>
    <div class="card"><h1>Lock Screen Facts</h1></div>
    <br>
    <div class="tagline">Learn something new,<br>every time you unlock.</div>
  </div>
</body>
</html>
